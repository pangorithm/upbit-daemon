[package]
name = "upbit-daemon"
version = "0.1.0"
edition = "2021"
description = "업비트 API 정보 수집 데몬"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-postgres = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
bytes = "1"
thiserror = "2"
flate2 = "1"
anyhow = "1"
tokio-util = "0.7"
